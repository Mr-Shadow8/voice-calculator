name: Build Voice Calculator APK

# push 到 main/master 或在网页手动点 Run workflow 时触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---- 1. 拉取代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 2. Node.js 20(Capacitor CLI 需要) ----
      # 注意:仓库没有 package-lock.json,不要开 cache:'npm',否则该步骤会报错
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- 3. JDK 17(AGP 8.x / Gradle 需要) ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---- 4. Gradle 缓存(二次编译从 6 分降到 2 分) ----
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ---- 5. 安装 Capacitor 依赖 ----
      - name: Install npm dependencies
        run: npm install

      # ---- 6. 生成 Android 原生工程并同步网页资源 ----
      # CI 环境是干净检出,没有 android/ 目录,这里动态生成
      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets
        run: npx cap copy android

      # ---- 7. Gradle 编译 debug APK ----
      # ubuntu-latest 已预装 Android SDK 且 license 全部接受,无需任何额外配置
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ---- 8. 改名并输出信息 ----
      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk voice-calculator-debug.apk
          ls -lh voice-calculator-debug.apk

      # ---- 9. 上传 APK(在 Actions 运行页底部 Artifacts 下载) ----
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: voice-calculator-debug.apk
          if-no-files-found: error
          retention-days: 30
