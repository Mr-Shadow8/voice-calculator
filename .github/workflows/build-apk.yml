name: Build Voice Calculator APK

# 触发条件:push 到 main/master、PR、以及手动触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # GitHub 网页上可手动点 "Run workflow"

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 防止卡死,默认 6 小时太长

    steps:
      # ---- 1. 拉取代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 2. 准备 Python 3.11 ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 3. 安装系统依赖(Java/工具链) ----
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libstdc++6 libssl-dev \
            ccache

      # ---- 4. 安装 buildozer + cython ----
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ---- 5. 缓存 buildozer 全局数据(二次编译可从 30 分降到 5 分) ----
      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/global_packages
            ~/.buildozer/android/platform
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ---- 6. 设置环境变量 ----
      - name: Configure buildozer environment
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          mkdir -p ~/.buildozer

      # ---- 7. 触发 buildozer 下载 SDK(p4a 会失败但 SDK 已下下来) ----
      - name: Pre-download Android SDK
        run: |
          # 第一次运行 buildozer,会下载 Android SDK/NDK;
          # 它会因为 license 没接受而失败,这步允许失败
          buildozer -v android help > /dev/null 2>&1 || true
          # 保险:再尝试一次让 SDK 完整下载
          buildozer -v android adb > /dev/null 2>&1 || true

      # ---- 8. 接受所有 Android SDK License(修复 build-tools;37 无法安装的问题) ----
      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT"
          ls -la "$SDK_ROOT" 2>/dev/null || { echo "SDK not found"; exit 1; }
          # 找 sdkmanager(可能在 tools/bin 或 cmdline-tools/*/bin)
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found, listing SDK tree:"
            find "$SDK_ROOT" -maxdepth 5 -type f 2>/dev/null | head -50
            exit 1
          fi
          # 自动接受所有 license(给一个文件,避免交互卡死)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 显式安装报错的 build-tools;37.0.0 和 aidl
          yes | "$SDKMANAGER" "build-tools;37.0.0" > /dev/null 2>&1 || true
          # 验证 build-tools 装上了
          ls "$SDK_ROOT/build-tools/" || echo "build-tools still missing"
          # 验证 aidl 存在
          AIDL=$(find "$SDK_ROOT/build-tools" -name aidl -type f 2>/dev/null | head -1)
          echo "aidl: $AIDL"
          [ -n "$AIDL" ] || { echo "aidl still not found"; exit 1; }

      # ---- 9. 正式编译 APK ----
      - name: Build APK
        run: |
          buildozer -v android debug
        continue-on-error: false

      # ---- 10. 失败时上传日志便于排查 ----
      - name: Upload buildozer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/**/*.log
          if-no-files-found: ignore

      # ---- 11. 上传最终 APK ----
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30  # 保留 30 天,足够下载

      # ---- 12. 输出 APK 文件大小(便于判断是否完整) ----
      - name: Show APK info
        run: |
          ls -lh bin/*.apk
          echo "::notice::APK built successfully, available in the 'voice-calculator-apk' artifact."
