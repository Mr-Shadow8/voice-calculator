name: Build Voice Calculator APK

# 触发条件:push 到 main/master、PR、以及手动触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # GitHub 网页上可手动点 "Run workflow"

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 防止卡死,默认 6 小时太长

    steps:
      # ---- 1. 拉取代码 ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 2. 准备 Python 3.11 ----
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 3. 安装系统依赖(Java/工具链) ----
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libstdc++6 libssl-dev \
            ccache

      # ---- 4. 安装 buildozer + cython ----
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ---- 5. 缓存 buildozer 全局数据(二次编译可从 30 分降到 5 分) ----
      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/global_packages
            ~/.buildozer/android/platform
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ---- 6. 配置环境变量(给 buildozer 用) ----
      - name: Configure buildozer environment
        run: |
          # CI 里非交互运行,需要把 ANDROID_HOME 提前设好
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          # 写一个 user.local.properties 避免 buildozer 卡在询问
          mkdir -p ~/.buildozer
          echo "[buildozer]" > ~/.buildozer/buildozer.spec.bak
          # 接受 Android SDK 许可(避免 CI 卡住)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ---- 7. 编译 APK(debug 版本) ----
      - name: Build APK
        run: |
          buildozer -v android debug
        # buildozer 在 CI 中可能因为源码目录布局而失败,加个保险:
        # 如果失败,显示日志便于排错
        continue-on-error: false

      # ---- 8. 失败时上传日志便于排查 ----
      - name: Upload buildozer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/**/*.log
          if-no-files-found: ignore

      # ---- 9. 上传最终 APK ----
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-calculator-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30  # 保留 30 天,足够下载

      # ---- 10. 输出 APK 文件大小(便于判断是否完整) ----
      - name: Show APK info
        run: |
          ls -lh bin/*.apk
          echo "::notice::APK built successfully, available in the 'voice-calculator-apk' artifact."
